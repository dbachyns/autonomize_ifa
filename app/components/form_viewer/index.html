<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --high:#16a34a; --medium:#ca8a04; --low:#dc2626; --reviewed:#2563eb; --blank:#a3a3a3; --unknown:#525252;
          --error:#dc2626; --warning:#ea580c; --info:#2563eb; --hot:#ff8c00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Source Sans Pro", -apple-system, system-ui, sans-serif; font-size:14px; color:#262730; }
  #wrap { display:flex; gap:12px; height:100vh; }
  #scan { flex: 1.7; overflow:auto; border:1px solid #e6e6e6; border-radius:8px; background:#fafafa; position:relative; }
  #scan svg { display:block; width:100%; height:auto; margin-bottom:8px; background:white; }
  #list { flex: 1; overflow:auto; border:1px solid #e6e6e6; border-radius:8px; }
  .box { fill: transparent; stroke-width: 5; vector-effect: non-scaling-stroke; stroke-width: 2; cursor:pointer; }
  .lvl-high { stroke: var(--high); } .lvl-medium { stroke: var(--medium); } .lvl-low { stroke: var(--low); }
  .lvl-reviewed { stroke: var(--reviewed); } .lvl-blank { stroke: var(--blank); } .lvl-unknown { stroke: var(--unknown); }
  svg.focus .box, svg.focus .badge { opacity: .12; }
  svg.focus .box.hot, svg.focus .badge.hot { opacity: 1; }
  .box.hot { stroke: var(--hot) !important; stroke-width: 4; fill: rgba(255,214,0,.28); }
  .badge { cursor:pointer; }
  .badge circle { stroke: white; stroke-width: 3; vector-effect: non-scaling-stroke; }
  .badge text { fill: white; font-weight: 700; font-family: sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events:none; }
  .sev-error circle { fill: var(--error); } .sev-warning circle { fill: var(--warning); } .sev-info circle { fill: var(--info); }
  .section { position: sticky; top:0; background:#f0f2f6; padding:4px 10px; font-size:12px; font-weight:600; color:#555;
             border-bottom:1px solid #e6e6e6; z-index:1; }
  .row { padding:6px 10px; border-bottom:1px solid #f0f0f0; cursor:pointer; display:flex; gap:8px; align-items:flex-start; }
  .row:hover, .row.hot { background:#fff7e0; }
  .row.selected { background:#ffe8b3; box-shadow: inset 3px 0 0 var(--hot); }
  .dot { width:10px; height:10px; border-radius:50%; margin-top:5px; flex:none; }
  .main { min-width:0; flex:1; }
  .label { font-size:12px; color:#6b6b6b; }
  .value { font-weight:600; overflow-wrap:anywhere; }
  .value.empty { font-weight:400; color:#a3a3a3; font-style: italic; }
  .issue { font-size:12px; margin-top:2px; }
  .issue.error { color: var(--error); } .issue.warning { color: var(--warning); } .issue.info { color: #555; }
  .issue.ack { color:#999; text-decoration: line-through; }
  .nobox { font-size:11px; color:#999; }
  #tip { position:fixed; pointer-events:none; background:#262730; color:white; padding:6px 8px; border-radius:6px;
         font-size:12px; max-width:340px; display:none; z-index:10; }
  #empty { padding:16px; color:#666; }
  #scanwrap { flex:1.7; position:relative; display:flex; }
  #zoombtn { position:absolute; top:8px; right:14px; z-index:5; background:white; border:1px solid #d0d0d0;
             border-radius:6px; padding:3px 8px; font-size:12px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  #zoombtn.on { background:#262730; color:white; border-color:#262730; }
</style>
</head>
<body>
<div id="wrap"><div id="scanwrap"><div id="scan"></div><button id="zoombtn">🔍 Zoom to value</button></div><div id="list"></div></div>
<div id="tip"></div>
<script>
// Minimal Streamlit custom-component protocol (no build step needed).
function send(type, data) { window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*"); }
let state = {items: [], pages: [], selected: null, height: 820};
let clickCount = 0;
let zoom = (() => { try { return localStorage.getItem("formViewerZoom") !== "off"; } catch (e) { return true; } })();
const zoomBtn = document.getElementById("zoombtn");
function paintZoomBtn() { zoomBtn.classList.toggle("on", zoom); zoomBtn.textContent = zoom ? "🔍 Zoom to value: on" : "🔍 Zoom to value: off"; }
zoomBtn.addEventListener("click", () => {
  zoom = !zoom; paintZoomBtn();
  try { localStorage.setItem("formViewerZoom", zoom ? "on" : "off"); } catch (e) {}
  focusOn(state.selected);
});
paintZoomBtn();
const COLORS = {high:"#16a34a", medium:"#ca8a04", low:"#dc2626", reviewed:"#2563eb", blank:"#a3a3a3", unknown:"#525252"};
const SEV_ICON = {error:"!", warning:"!", info:"i"};

window.addEventListener("message", (event) => {
  if (event.data.type !== "streamlit:render") return;
  const a = event.data.args;
  const sameDoc = state.doc === a.doc && state.signature === a.signature;
  state = Object.assign(state, a);
  if (!sameDoc) render(); else select(a.selected, false);
  send("streamlit:setFrameHeight", {height: a.height});
});
send("streamlit:componentReady", {apiVersion: 1});

function el(tag, attrs, parent, ns) {
  const e = ns ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function render() {
  const scan = document.getElementById("scan"), list = document.getElementById("list");
  scan.innerHTML = ""; list.innerHTML = "";
  document.getElementById("wrap").style.height = state.height + "px";
  state.svgs = state.pages.map((p, i) => {
    const svg = el("svg", {viewBox: `0 0 ${p.w} ${p.h}`, "data-page": i + 1}, scan, true);
    el("image", {href: p.src, x: 0, y: 0, width: p.w, height: p.h}, svg, true);
    return svg;
  });
  if (!state.items.length) { list.innerHTML = '<div id="empty">Nothing to show with this filter.</div>'; return; }

  let section = null;
  for (const it of state.items) {
    // scan boxes
    for (const [page, x0, y0, x1, y1] of it.boxes) {
      const svg = state.svgs[page - 1]; if (!svg) continue;
      const pad = 6;
      const r = el("rect", {x: x0 - pad, y: y0 - pad, width: x1 - x0 + 2 * pad, height: y1 - y0 + 2 * pad, rx: 4,
                            class: `box lvl-${it.level}`, "data-id": it.id}, svg, true);
      bindHover(r, it);
    }
    // one badge per item with content issues, at the top-right of its first box
    const open = it.issues.filter(i => !i.ack);
    if (open.length && it.boxes.length) {
      const [page, x0, y0, x1, y1] = it.boxes[0];
      const svg = state.svgs[page - 1];
      if (svg) {
        const sev = open.some(i => i.severity === "error") ? "error" : open.some(i => i.severity === "warning") ? "warning" : "info";
        const radius = Math.max(16, state.pages[page - 1].w / 110);
        const g = el("g", {class: `badge sev-${sev}`, "data-id": it.id}, svg, true);
        el("circle", {cx: x1 + 6, cy: y0 - 6, r: radius}, g, true);
        const t = el("text", {x: x1 + 6, y: y0 - 6, "font-size": radius * 1.3}, g, true);
        t.textContent = SEV_ICON[sev];
        bindHover(g, it);
      }
    }
    // list row
    if (it.section !== section) {
      section = it.section;
      const s = el("div", {class: "section"}, list); s.textContent = section || "Other";
    }
    const row = el("div", {class: "row", "data-id": it.id}, list);
    const dot = el("div", {class: "dot"}, row); dot.style.background = COLORS[it.level];
    const main = el("div", {class: "main"}, row);
    el("div", {class: "label"}, main).textContent = it.label;
    const v = el("div", {class: "value" + (it.value ? "" : " empty")}, main);
    v.textContent = it.value || "(blank)";
    for (const iss of it.issues) {
      const d = el("div", {class: `issue ${iss.severity}` + (iss.ack ? " ack" : "")}, main);
      d.textContent = (iss.severity === "error" ? "🛑 " : iss.severity === "warning" ? "⚠️ " : "ℹ️ ") + iss.message;
    }
    if (!it.boxes.length && it.value) el("div", {class: "nobox"}, main).textContent = "not located on the scan";
    bindHover(row, it);
  }
  select(state.selected, true);
}

function bindHover(node, it) {
  node.addEventListener("mouseenter", (e) => { hot(it.id, node.classList.contains("row")); showTip(e, it, node); });
  node.addEventListener("mousemove", (e) => moveTip(e));
  node.addEventListener("mouseleave", () => { hot(state.selected, false); hideTip(); });
  node.addEventListener("click", () => {
    clickCount += 1;
    select(it.id, !node.classList.contains("row"));
    send("streamlit:setComponentValue", {value: {id: it.id, n: clickCount}, dataType: "json"});
  });
}

// Highlight one item: its boxes on the scan (everything else dimmed) and its row in the list.
function hot(id, scrollScan) {
  document.querySelectorAll(".hot").forEach(n => n.classList.remove("hot"));
  const any = id != null;
  (state.svgs || []).forEach(s => s.classList.toggle("focus", any));
  if (!any) { focusOn(null); return; }
  const boxes = document.querySelectorAll(`[data-id="${CSS.escape(id)}"]`);
  boxes.forEach(n => n.classList.add("hot"));
  if (zoom) focusOn(id);
  else if (scrollScan) {
    const r = document.querySelector(`rect[data-id="${CSS.escape(id)}"]`);
    if (r) scrollIntoViewIfNeeded(r, document.getElementById("scan"));
  }
}

// Zoom: show a full-width band of the page around the item, large enough to read; null = whole pages.
function focusOn(id) {
  const it = id != null && zoom ? state.items.find(i => i.id === id) : null;
  const box = it && it.boxes.length ? it.boxes[0] : null;
  (state.svgs || []).forEach((svg, i) => {
    const p = state.pages[i];
    if (!box) { svg.setAttribute("viewBox", `0 0 ${p.w} ${p.h}`); svg.style.display = ""; return; }
    if (box[0] !== i + 1) { svg.style.display = "none"; return; }
    const mine = it.boxes.filter(b => b[0] === i + 1);
    const x0 = Math.min(...mine.map(b => b[1])), x1 = Math.max(...mine.map(b => b[3]));
    const y0 = Math.min(...mine.map(b => b[2])), y1 = Math.max(...mine.map(b => b[4]));
    const scan = document.getElementById("scan");
    const aspect = scan.clientHeight / Math.max(scan.clientWidth, 1);
    // ~2.2x magnification, but always wide enough for the value plus some context on each side
    const vw = Math.min(p.w, Math.max(p.w / 2.2, (x1 - x0) * 1.6));
    const vh = Math.min(p.h, vw * aspect);
    const vx = Math.max(0, Math.min(p.w - vw, (x0 + x1) / 2 - vw / 2));
    const vy = Math.max(0, Math.min(p.h - vh, (y0 + y1) / 2 - vh / 2));
    svg.setAttribute("viewBox", `${vx} ${vy} ${vw} ${vh}`);
    svg.style.display = "";
  });
  if (box) document.getElementById("scan").scrollTop = 0;
}

function select(id, scrollList) {
  state.selected = id;
  document.querySelectorAll(".row.selected").forEach(n => n.classList.remove("selected"));
  if (id == null) { hot(null); return; }
  const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if (row) { row.classList.add("selected"); if (scrollList) scrollIntoViewIfNeeded(row, document.getElementById("list")); }
  hot(id, true);
}

function scrollIntoViewIfNeeded(node, container) {
  const n = node.getBoundingClientRect(), c = container.getBoundingClientRect();
  if (n.top < c.top + 20 || n.bottom > c.bottom - 20) {
    container.scrollBy({top: n.top - c.top - c.height / 3, behavior: "smooth"});
  }
}

const tip = document.getElementById("tip");
function showTip(e, it, node) {
  if (node.classList.contains("row")) return;  // the row already shows everything
  tip.innerHTML = `<b>${esc(it.label)}</b><br>${esc(it.value || "(blank)")}<br><span style="opacity:.8">${esc(it.reading)}</span>` +
    it.issues.map(i => `<br>${i.severity === "error" ? "🛑" : i.severity === "warning" ? "⚠️" : "ℹ️"} ${esc(i.message)}`).join("");
  tip.style.display = "block"; moveTip(e);
}
function moveTip(e) { tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 350) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip() { tip.style.display = "none"; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
</script>
</body>
</html>
